<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 丸みを帯びた背景 -->
  <rect width="32" height="32" rx="8" fill="#e55f3a"/>
  <!-- P と Q のモノグラム -->
  <circle cx="16" cy="14" r="6" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- P の縦棒 -->
  <line x1="12" y1="8" x2="12" y2="24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Q の斜め棒 -->
  <line x1="18" y1="18" x2="24" y2="24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
